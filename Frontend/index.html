<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALDOMART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
  <a href="#" class="logo">
    <span class="logo-text">ALDOMART</span>
  </a>

  <button class="btn-kategori">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    Kategori
  </button>

  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="Temukan produk favoritmu disini" />
    <button class="search-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  <button class="cart-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#555"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.17 14.75l.03-.12.9-1.63H15.55c.75 0 1.41-.41 1.75-1.03L20.88 5H5.21L4 2H1v2h2l3.6 7.59L5.25 14c-.16.28-.25.61-.25.94C5 16.1 5.9 17 7 17h12v-2H7.42c-.13 0-.25-.11-.25-.25z"/></svg>
  </button>

  <button class="btn-auth btn-daftar">Daftar</button>
  <button class="btn-auth btn-masuk">Masuk</button>
</nav>

<!-- Main Content -->
<main>

  <!-- Section 1 -->
  <h2 class="section-title">Produk Pilihan</h2>
  <div class="product-grid" id="productGrid"></div>

  <div class="see-more-wrap">
    <a href="#" class="see-more">
      Lihat Selengkapnya
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </a>
  </div>

  <!-- Section 2: Produk Terbaru -->
  <h2 class="section-title">Produk Terbaru</h2>
  <div class="product-grid" id="productGrid2"></div>

    <!-- FOOTER -->

</main>



<script>
  const newProducts = [
    { name: "Safety Vision Snack Crackers 85 g",  price: "Rp 8.500",  cat: "Snack",      image: "🥨" },
    { name: "Topping Almond Premium Pack 100 g",  price: "Rp 22.000", cat: "Makanan",    image: "🌰" },
    { name: "Coca-Cola Zero Sugar 330 ml",        price: "Rp 7.000",  cat: "Minuman",    image: "🥤" },
    { name: "Derma Angel Skin Gel 50 ml",         price: "Rp 14.000", cat: "Kecantikan", image: "💆" },
    { name: "Rexona Men Active Sport 150 ml",     price: "Rp 21.000", cat: "Perawatan",  image: "🧴" },
    { name: "Nivea Moisturizing Lotion 200 ml",   price: "Rp 35.000", cat: "Kecantikan", image: "🪷" },
  ];

  function renderCards(list, containerId) {
    const el = document.getElementById(containerId);
    if (!list || list.length === 0) return;

    el.innerHTML = list.map(p => {
      
      let imageUrl = p.image;
      if (!imageUrl.startsWith('http') && imageUrl.length > 5) {
        imageUrl = '../Backend/' + imageUrl;
      }

      let textStok = p.stock !== undefined ? p.stock + " pcs" : "Tersedia";

      return `
        <div class="product-card" data-category="${p.cat.toLowerCase().replace(' ', '-')}">
          <div class="card-img-wrap">
            <div class="ribbon"></div>
            <!-- Menggunakan variabel imageUrl yang sudah pintar -->
            <img src="${imageUrl}" alt="${p.name}" style="width:100px;height:100px;object-fit:contain;" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
            <div class="badge">${p.cat}</div>
          </div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-price">${p.price}</div>
            <div class="delivery-tag">
              <div class="delivery-dot"></div> Stok: ${textStok}
            </div>
            <button class="btn-beli">Beli</button>
          </div>
        </div>
      `;
    }).join('');
  }

  fetch('../Backend/1.php')
    .then(response => {
      if (!response.ok) throw new Error('Gagal ambil data');
      return response.json();
    })
    .then(dataDariDatabase => {
      renderCards(dataDariDatabase, 'productGrid');
      
      if (typeof updateShowingText === "function") {
        updateShowingText();
      }
    })
    .catch(error => {
      console.error('Error:', error);
      document.getElementById('productGrid').innerHTML = '<p style="color:red; text-align:center;">Gagal terhubung ke Database. Pastikan XAMPP menyala.</p>';
    });
  
  renderCards(newProducts, 'productGrid2');
</script>
  
</body>
</html>
